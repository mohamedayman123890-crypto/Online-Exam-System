<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="login-card">
      <div class="brand">
        <div class="logo">Q</div>
        <div>
          <span class="small">ONLINE</span>
          <h1>Quiz Portal</h1>
        </div>
      </div>

      <p class="welcome">Welcome back. Enter your details to start your exam.</p>

      <form id="loginForm">
        <label>Student Name</label>
        <input id="name" type="text" placeholder="Enter your full name" required>

        <label>Student ID</label>
        <input id="studentId" type="text" placeholder="Enter your student ID" required>

        <button type="submit">Start Quiz <span>→</span></button>
      </form>

      <div class="powered">powered by <strong>Eng. Mohamed Ayman</strong></div>
    </section>

    <div class="glow one"></div>
    <div class="glow two"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
